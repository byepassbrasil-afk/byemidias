{
  "$schema": "https://supabase.com/docs/guides/local-development/schema-introspection",
  "auth": {
    "providers": ["email"]
  },
  "storage": {
    "buckets": [
      {
        "name": "media",
        "public": true,
        "fileSizeLimit": "500MB",
        "allowedMimeTypes": [
          "image/jpeg",
          "image/png",
          "image/gif",
          "image/webp",
          "video/mp4",
          "video/webm",
          "application/pdf"
        ]
      },
      {
        "name": "templates",
        "public": false,
        "fileSizeLimit": "10MB"
      },
      {
        "name": "branding",
        "public": true,
        "fileSizeLimit": "5MB"
      }
    ]
  }
}
